version: '3.8'

services:

  # ============================================================
  # PostgreSQL - Cryvex Dashboard Database
  # ============================================================
  cryvex_db:
    image: postgres:15
    container_name: cryvex_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: cryvex_db
    ports:
      - "5433:5432"
    volumes:
      - cryvex_db_data:/var/lib/postgresql/data
    networks:
      - cryvex_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryvex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend - FastAPI
  # ============================================================
  cryvex_backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cryvex_backend
    restart: unless-stopped
    depends_on:
      cryvex_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:123@cryvex_db:5432/cryvex_db
      SECRET_KEY: your-secret-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      APP_NAME: CRYVEX
      DEBUG: "True"
      # Airflow - update this to point to your running Airflow instance
      AIRFLOW_API_URL: http://host.docker.internal:8080/api/v2
      AIRFLOW_USERNAME: ""
      AIRFLOW_PASSWORD: ""
    ports:
      - "8000:8000"
    volumes:
      # Mount pipeline_configs so saved YAMLs persist
      - ./Backend/pipeline_configs:/app/pipeline_configs
    networks:
      - cryvex_network

  # ============================================================
  # Frontend - React/Vite (production build served by nginx)
  # ============================================================
  cryvex_frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: cryvex_frontend
    restart: unless-stopped
    depends_on:
      - cryvex_backend
    ports:
      - "3000:80"
    networks:
      - cryvex_network


volumes:
  cryvex_db_data:

networks:
  cryvex_network:
    driver: bridge
