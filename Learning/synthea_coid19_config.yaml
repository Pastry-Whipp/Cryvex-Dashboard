# Synthea COVID-19 Dataset - Complete ETL Configuration
# 16 Base Tables + 6 Derived Tables for Healthcare Analytics

project:
  name: "Synthea COVID-19 Healthcare Dataset"
  domain: "healthcare"
  version: "1.0"
  description: "Complete ETL for 100k Synthea COVID-19 synthetic healthcare data"

# ==================== GLOBAL SETTINGS ====================
global:
  database:
    type: "postgresql"
    host: "postgres"
    port: 5432
    database: "postgres"
    username: "postgres"
    password: "postgres"
  
  blockchain:
    enabled: true
    network: "ganache"
    rpc_url: "http://host.docker.internal:8545"
    contract_address: "0xc6a4A67fb394fBF51Df9C5b29BC2268c976BE29f"
    private_key: "0xbe17a6fc305f865049072780cce76c7600dea21e999175b65505999bfe4095f3"
    abi_file: "/usr/local/airflow/include/etl_modules/abi.json"
  
  pipeline:
    batch_size: 10000
    log_level: "INFO"

# ==================== EXECUTION SETTINGS ====================
execution:
  mode: "parallel"
  stop_on_error: false
  max_parallel_tasks: 6

# ==================== BASE TABLES ====================
tables:
  
  # ============================================================
  # CORE ENTITIES (Priority 1)
  # ============================================================
  
  patients:
    priority: 1
    depends_on: []
    
    source:
      file:
        path: "/usr/local/airflow/datasets/data/100k_synthea_covid19_csv/patients.csv"
        type: "csv"
        encoding: "utf-8"
        delimiter: ","
        has_header: true
    
    mapping:
      auto_map: true
      unmapped_columns: "ignore"
    
    target:
      table_name: "patients"
      if_exists: "replace"
      create_if_not_exists: true
    
    schema:
      file: "/usr/local/airflow/datasets/schemas/synthea_patients_schema.json"
    
    transformations:
      inline:
        - column: "Id"
          action: "trim"
        - column: "SSN"
          action: "trim"
        - column: "FIRST"
          action: "trim"
        - column: "LAST"
          action: "trim"
        - column: "GENDER"
          action: "uppercase"
        - column: "RACE"
          action: "lowercase"
        - column: "ETHNICITY"
          action: "lowercase"
    
    validations:
      inline:
        - column: "Id"
          rule: "not_null"
        - column: "BIRTHDATE"
          rule: "not_null"
        - column: "GENDER"
          rule: "in_list"
          values: ["M", "F"]
  
  organizations:
    priority: 1
    depends_on: []
    
    source:
      file:
        path: "/usr/local/airflow/datasets/data/100k_synthea_covid19_csv/organizations.csv"
        type: "csv"
        encoding: "utf-8"
        delimiter: ","
        has_header: true
    
    mapping:
      auto_map: true
      unmapped_columns: "ignore"
    
    target:
      table_name: "organizations"
      if_exists: "replace"
      create_if_not_exists: true
    
    schema:
      file: "/usr/local/airflow/datasets/schemas/synthea_organizations_schema.json"
    
    transformations:
      inline:
        - column: "Id"
          action: "trim"
        - column: "NAME"
          action: "trim"
        - column: "STATE"
          action: "uppercase"
    
    validations:
      inline:
        - column: "Id"
          rule: "not_null"
        - column: "NAME"
          rule: "not_null"
  
  payers:
    priority: 1
    depends_on: []
    
    source:
      file:
        path: "/usr/local/airflow/datasets/data/100k_synthea_covid19_csv/payers.csv"
        type: "csv"
        encoding: "utf-8"
        delimiter: ","
        has_header: true
    
    mapping:
      auto_map: true
      unmapped_columns: "ignore"
    
    target:
      table_name: "payers"
      if_exists: "replace"
      create_if_not_exists: true
    
    schema:
      file: "/usr/local/airflow/datasets/schemas/synthea_payers_schema.json"
    
    transformations:
      inline:
        - column: "Id"
          action: "trim"
        - column: "NAME"
          action: "trim"
    
    validations:
      inline:
        - column: "Id"
          rule: "not_null"
  
  # ============================================================
  # DEPENDENT ENTITIES (Priority 2)
  # ============================================================
  
