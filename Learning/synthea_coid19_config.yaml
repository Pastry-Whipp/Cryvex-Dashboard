        - column: "TOTAL_CLAIM_COST"
          action: "round"
          decimals: 2
        - column: "PAYER_COVERAGE"
          action: "round"
          decimals: 2
    
    validations:
      inline:
        - column: "Id"
          rule: "not_null"
        - column: "PATIENT"
          rule: "not_null"
