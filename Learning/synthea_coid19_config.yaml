# ==================== DERIVED TABLES (Healthcare Analytics) ====================
derived_tables:
  
  # ============================================================
  # Derived Table 1: Patient Summary
  # ============================================================
  patient_summary:
    priority: 10
    depends_on: ["patients", "encounters", "conditions", "medications", "procedures"]
    
    query:
      type: "patient_analytics"
      sql: |
        SELECT 
          p."Id" as patient_id,
          p."FIRST" as first_name,
          p."LAST" as last_name,
          p."GENDER" as gender,
          p."RACE" as race,
          p."ETHNICITY" as ethnicity,
          p."BIRTHDATE" as birthdate,
          p."DEATHDATE" as deathdate,
          p."CITY" as city,
          p."STATE" as state,
          p."HEALTHCARE_EXPENSES" as healthcare_expenses,
          p."HEALTHCARE_COVERAGE" as healthcare_coverage,
          COUNT(DISTINCT e."Id") as total_encounters,
          COUNT(DISTINCT c."CODE") as unique_conditions,
          COUNT(DISTINCT m."CODE") as unique_medications,
          COUNT(DISTINCT pr."CODE") as total_procedures,
          SUM(e."TOTAL_CLAIM_COST") as total_claim_costs,
          SUM(e."PAYER_COVERAGE") as total_payer_coverage,
          SUM(e."TOTAL_CLAIM_COST") - SUM(e."PAYER_COVERAGE") as out_of_pocket_costs,
          MIN(e."START") as first_encounter_date,
          MAX(e."START") as last_encounter_date
        FROM patients p
        LEFT JOIN encounters e ON p."Id" = e."PATIENT"
        LEFT JOIN conditions c ON p."Id" = c."PATIENT"
        LEFT JOIN medications m ON p."Id" = m."PATIENT"
        LEFT JOIN procedures pr ON p."Id" = pr."PATIENT"
        GROUP BY 
          p."Id", p."FIRST", p."LAST", p."GENDER", p."RACE", p."ETHNICITY",
          p."BIRTHDATE", p."DEATHDATE", p."CITY", p."STATE",
          p."HEALTHCARE_EXPENSES", p."HEALTHCARE_COVERAGE"
        ORDER BY total_claim_costs DESC
    
    target:
      table_name: "patient_summary"
      if_exists: "replace"
      create_if_not_exists: true
  
  # ============================================================
  # Derived Table 2: COVID-19 Patients Analysis
  # ============================================================
  covid_patients:
    priority: 11
    depends_on: ["patients", "conditions", "encounters", "careplans"]
    
    query:
      type: "covid_analytics"
      sql: |
        SELECT 
          p."Id" as patient_id,
          p."FIRST" || ' ' || p."LAST" as patient_name,
          p."GENDER" as gender,
          p."RACE" as race,
          p."ETHNICITY" as ethnicity,
          p."BIRTHDATE" as birthdate,
          EXTRACT(YEAR FROM AGE(CAST(p."BIRTHDATE" AS DATE))) as age,
          p."CITY" as city,
          p."STATE" as state,
          c."START" as covid_diagnosis_date,
          c."STOP" as covid_resolved_date,
          c."CODE" as condition_code,
          c."DESCRIPTION" as condition_description,
          cp."DESCRIPTION" as careplan_description,
          COUNT(DISTINCT e."Id") as covid_related_encounters,
          SUM(e."TOTAL_CLAIM_COST") as covid_total_costs
        FROM patients p
        INNER JOIN conditions c ON p."Id" = c."PATIENT"
        LEFT JOIN careplans cp ON p."Id" = cp."PATIENT" AND cp."REASONCODE" = c."CODE"
        LEFT JOIN encounters e ON p."Id" = e."PATIENT" AND e."REASONCODE" = c."CODE"
        WHERE c."CODE" = '840544004' OR c."DESCRIPTION" ILIKE '%COVID%'
        GROUP BY 
          p."Id", p."FIRST", p."LAST", p."GENDER", p."RACE", p."ETHNICITY",
          p."BIRTHDATE", p."CITY", p."STATE",
          c."START", c."STOP", c."CODE", c."DESCRIPTION", cp."DESCRIPTION"
        ORDER BY covid_diagnosis_date DESC
    
    target:
      table_name: "covid_patients"
      if_exists: "replace"
      create_if_not_exists: true
  
  # ============================================================
  # Derived Table 3: Encounter Cost Analysis
  # ============================================================
  encounter_analytics:
    priority: 12
    depends_on: ["encounters", "patients", "organizations", "providers"]
    
    query:
      type: "encounter_cost_analysis"
      sql: |
        SELECT 
          e."Id" as encounter_id,
          e."PATIENT" as patient_id,
          p."FIRST" || ' ' || p."LAST" as patient_name,
          e."ENCOUNTERCLASS" as encounterclass,
          e."DESCRIPTION" as encounter_type,
          e."START" as encounter_date,
          o."NAME" as organization_name,
          pr."NAME" as provider_name,
          pr."SPECIALITY" as provider_specialty,
          e."BASE_ENCOUNTER_COST" as base_encounter_cost,
          e."TOTAL_CLAIM_COST" as total_claim_cost,
          e."PAYER_COVERAGE" as payer_coverage,
          (e."TOTAL_CLAIM_COST" - e."PAYER_COVERAGE") as patient_responsibility,
          CASE 
            WHEN e."PAYER_COVERAGE" > 0 THEN 
              ROUND((e."PAYER_COVERAGE" / e."TOTAL_CLAIM_COST" * 100)::NUMERIC, 2)
            ELSE 0 
          END as payer_coverage_percentage,
          e."REASONDESCRIPTION" as reasondescription
        FROM encounters e
        INNER JOIN patients p ON e."PATIENT" = p."Id"
        LEFT JOIN organizations o ON e."ORGANIZATION" = o."Id"
        LEFT JOIN providers pr ON e."PROVIDER" = pr."Id"
        WHERE e."TOTAL_CLAIM_COST" > 0
        ORDER BY e."TOTAL_CLAIM_COST" DESC
    
    target:
      table_name: "encounter_analytics"
      if_exists: "replace"
      create_if_not_exists: true
  
  # ============================================================
  # Derived Table 4: Medication Cost Analysis
  # ============================================================
  medication_analytics:
    priority: 13
    depends_on: ["medications", "patients"]
    
    query:
      type: "medication_cost_analysis"
      sql: |
        SELECT 
          m."CODE" as code,
          m."DESCRIPTION" as medication_name,
          COUNT(*) as prescription_count,
          COUNT(DISTINCT m."PATIENT") as unique_patients,
          SUM(m."TOTALCOST") as total_medication_cost,
          AVG(m."TOTALCOST") as avg_cost_per_prescription,
          MIN(m."TOTALCOST") as min_cost,
          MAX(m."TOTALCOST") as max_cost,
          SUM(m."PAYER_COVERAGE") as total_payer_coverage,
          SUM(m."TOTALCOST" - m."PAYER_COVERAGE") as total_patient_cost,
          ROUND(AVG(CASE 
            WHEN m."TOTALCOST" > 0 THEN (m."PAYER_COVERAGE" / m."TOTALCOST" * 100)::NUMERIC
            ELSE 0 
          END), 2) as avg_coverage_percentage,
          SUM(m."DISPENSES") as total_dispenses,
          m."REASONDESCRIPTION" as reasondescription
        FROM medications m
        GROUP BY m."CODE", m."DESCRIPTION", m."REASONDESCRIPTION"
        HAVING COUNT(*) > 1
        ORDER BY total_medication_cost DESC
    
    target:
      table_name: "medication_analytics"
      if_exists: "replace"
      create_if_not_exists: true
  
  # ============================================================
  # Derived Table 5: Provider Performance
  # ============================================================
  provider_performance:
    priority: 14
    depends_on: ["providers", "encounters", "organizations"]
    
    query:
      type: "provider_analytics"
      sql: |
        SELECT 
          pr."Id" as provider_id,
          pr."NAME" as provider_name,
          pr."GENDER" as provider_gender,
          pr."SPECIALITY" as speciality,
          o."NAME" as organization_name,
          o."CITY" as organization_city,
          o."STATE" as organization_state,
          pr."UTILIZATION" as provider_utilization,
          COUNT(DISTINCT e."Id") as total_encounters,
          COUNT(DISTINCT e."PATIENT") as unique_patients,
          SUM(e."TOTAL_CLAIM_COST") as total_revenue,
          AVG(e."TOTAL_CLAIM_COST") as avg_encounter_cost,
          COUNT(DISTINCT CASE WHEN e."ENCOUNTERCLASS" = 'inpatient' THEN e."Id" END) as inpatient_encounters,
          COUNT(DISTINCT CASE WHEN e."ENCOUNTERCLASS" = 'outpatient' THEN e."Id" END) as outpatient_encounters,
          COUNT(DISTINCT CASE WHEN e."ENCOUNTERCLASS" = 'emergency' THEN e."Id" END) as emergency_encounters,
          COUNT(DISTINCT CASE WHEN e."ENCOUNTERCLASS" = 'ambulatory' THEN e."Id" END) as ambulatory_encounters
        FROM providers pr
        LEFT JOIN organizations o ON pr."ORGANIZATION" = o."Id"
        LEFT JOIN encounters e ON pr."Id" = e."PROVIDER"
        GROUP BY 
          pr."Id", pr."NAME", pr."GENDER", pr."SPECIALITY",
          o."NAME", o."CITY", o."STATE", pr."UTILIZATION"
        HAVING COUNT(DISTINCT e."Id") > 0
        ORDER BY total_revenue DESC
    
    target:
      table_name: "provider_performance"
      if_exists: "replace"
      create_if_not_exists: true
  
  # ============================================================
  # Derived Table 6: Payer Coverage Analysis
  # ============================================================
  payer_analytics:
    priority: 15
    depends_on: ["payers", "encounters", "medications"]
    
    query:
      type: "payer_coverage_analysis"
      sql: |
        SELECT 
          py."Id" as payer_id,
          py."NAME" as payer_name,
          py."CITY" as payer_city,
          py."STATE_HEADQUARTERED" as payer_state,
          py."REVENUE" as payer_revenue,
          py."AMOUNT_COVERED" as total_amount_covered,
          py."AMOUNT_UNCOVERED" as total_amount_uncovered,
          COUNT(DISTINCT e."Id") as total_encounters_covered,
          COUNT(DISTINCT e."PATIENT") as unique_patients_covered,
          SUM(e."TOTAL_CLAIM_COST") as total_encounter_claims,
          SUM(e."PAYER_COVERAGE") as total_encounter_coverage,
          COUNT(DISTINCT m."PATIENT") as patients_with_medications,
          SUM(m."TOTALCOST") as total_medication_costs,
          SUM(m."PAYER_COVERAGE") as total_medication_coverage,
          ROUND((py."AMOUNT_COVERED" / (py."AMOUNT_COVERED" + py."AMOUNT_UNCOVERED") * 100)::NUMERIC, 2) as coverage_rate_percentage,
          py."UNIQUE_CUSTOMERS" as unique_customers,
          py."QOLS_AVG" as avg_quality_of_life_score
        FROM payers py
        LEFT JOIN encounters e ON py."Id" = e."PAYER"
        LEFT JOIN medications m ON py."Id" = m."PAYER"
        GROUP BY 
          py."Id", py."NAME", py."CITY", py."STATE_HEADQUARTERED",
          py."REVENUE", py."AMOUNT_COVERED", py."AMOUNT_UNCOVERED",
          py."UNIQUE_CUSTOMERS", py."QOLS_AVG"
        ORDER BY total_encounter_claims DESC
    
    target:
      table_name: "payer_analytics"
      if_exists: "replace"
      create_if_not_exists: true


# ==================== NOTES ====================
#
# DATASET SUMMARY:
# - 16 Base Tables (from CSV files)
# - 6 Derived Tables (SQL queries with JOIN/GROUP BY)
# - ~100k synthetic patient records
# - COVID-19 focused healthcare data
#
# EXECUTION ORDER:
# Priority 1: Core entities (patients, organizations, payers)
# Priority 2: Dependent entities (providers, encounters, payer_transitions)
# Priority 3: Clinical data (allergies, conditions, medications, etc.)
# Priority 10-15: Derived analytics tables
#
# DERIVED TABLES:
# 1. patient_summary - Per-patient aggregations (costs, encounters, conditions)
# 2. covid_patients - COVID-19 specific patient analysis
# 3. encounter_analytics - Encounter cost and coverage analysis
# 4. medication_analytics - Medication prescriptions and costs
# 5. provider_performance - Provider utilization and revenue
# 6. payer_analytics - Insurance coverage and claims analysis
#
# BLOCKCHAIN VERIFICATION:
# - 22 Merkle roots total (16 base + 6 derived)
# - All stored on Ganache blockchain
# - merkle_audit table will have 22 rows
#
# PERFORMANCE:
# - Parallel execution for independent tables
# - Batch size: 10K (50K for observations table)
# - Expected runtime: 5-15 minutes for full dataset